{% extends "base.html" %}

{% block title %}{{ module.name }} - Pregunta {{ question_order }}{% endblock %}

{% block content %}
<div class="container">
    <div id="question-slot">
        {% include "soft_skills/_question_content.html" %}
    </div>
</div>

<script>
// Global helpers — referenced by inline onclick attributes inside the partial.
// Defined once in the wrapper so they survive innerHTML swaps.
function selectOption(el, answer) {
    document.querySelectorAll('.option-selectable').forEach(function(c) {
        c.classList.remove('option-selected');
    });
    el.classList.add('option-selected');
    var input = document.getElementById('selected-answer');
    var btn = document.getElementById('submit-btn');
    if (input) input.value = answer;
    if (btn) btn.disabled = false;
}

function closeFeedbackModal() {
    var modal = document.getElementById('feedback-modal');
    if (modal) modal.classList.add('fb-modal-overlay--closed');
}

function openFeedbackModal() {
    var modal = document.getElementById('feedback-modal');
    if (modal) modal.classList.remove('fb-modal-overlay--closed');
}

// SPA controller: intercepts form submit + data-spa link clicks, swaps the
// #question-slot innerHTML with server-rendered partial, and updates history.
(function() {
    var slot = document.getElementById('question-slot');
    if (!slot) return;

    function syncStreakChip() {
        // The navbar chip lives outside #question-slot and isn't replaced by the
        // innerHTML swap. The partial drops a <span class="streak-sync"> with
        // data-current/data-longest; copy those values to the chip after each swap.
        var sync = slot.querySelector('.streak-sync');
        var chip = document.querySelector('.answer-streak');
        if (!sync || !chip) return;
        var current = sync.dataset.current || '0';
        var longest = sync.dataset.longest || '0';
        var countEl = chip.querySelector('.answer-streak__count');
        if (!countEl) return;
        var changed = countEl.textContent !== current;
        countEl.textContent = current;
        chip.title = 'Racha de respuestas correctas seguidas. Mejor: ' + longest + '.';
        chip.classList.toggle('answer-streak--zero', current === '0');
        if (changed) {
            chip.classList.remove('answer-streak--pulse');
            // Force reflow so the animation restarts even if the class was
            // re-added inside the same frame.
            void chip.offsetWidth;
            chip.classList.add('answer-streak--pulse');
        }
    }

    function swap(url, init) {
        slot.classList.add('is-transitioning');
        var opts = Object.assign({ headers: {} }, init || {});
        opts.headers['X-Requested-With'] = 'XMLHttpRequest';
        return fetch(url, opts).then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        }).then(function(html) {
            slot.innerHTML = html;
            syncStreakChip();
        }).finally(function() {
            slot.classList.remove('is-transitioning');
        });
    }

    slot.addEventListener('submit', function(e) {
        var form = e.target.closest('#answer-form');
        if (!form) return;
        e.preventDefault();
        var btn = form.querySelector('#submit-btn');
        if (btn) btn.disabled = true; // prevent double-submit
        swap(form.action, {
            method: 'POST',
            body: new FormData(form),
        }).catch(function() {
            if (btn) btn.disabled = false;
        });
    });

    slot.addEventListener('click', function(e) {
        var link = e.target.closest('a[data-spa]');
        if (!link) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        var url = link.getAttribute('href');
        swap(url).then(function() {
            history.pushState({}, '', url);
        }).catch(function() {
            window.location.href = url;
        });
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeFeedbackModal();
    });
})();
</script>
{% endblock %}
