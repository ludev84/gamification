{% extends "base.html" %}
{% load static %}

{% block title %}{{ module.name }} - Pregunta {{ question_order }}{% endblock %}

{% block content %}
<div class="container">
    <div id="question-slot">
        {% include "soft_skills/_question_content.html" %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
// ───────── Correct-answer effects: tweak these two numbers ─────────
// Confetti intensity: 0 = off, 5 = medium, 10 = big & dense.
var CONFETTI_LEVEL = 5;
// Sound: 0 = off, 1 = simple, 2 = medium, 3 = full.
var SOUND_LEVEL = 2;
// XP feedback gamification (the points pill + floating points toast):
//   1 = none        → no pill, no toast
//   2 = static pill → pill shown, no animation
//   3 = animated    → pill animates (pulse)
//   4 = full        → animated pill + floating points toast
var GAMIFICATION_LEVEL = 4;
// ────────────────────────────────────────────────────────────────────

var CORRECT_SOUND_FILES = {
    1: "{% static 'soft_skills/audio/simple-correct.mp3' %}",
    2: "{% static 'soft_skills/audio/medium-correct.mp3' %}",
    3: "{% static 'soft_skills/audio/full-correct.mp3' %}"
};

function fireConfetti(level) {
    if (!level || level < 1 || typeof confetti !== 'function') return;
    var lv = Math.min(10, level);
    var count = Math.round(20 + lv * 23);
    var spread = 50 + lv * 10;
    var scalar = 0.7 + lv * 0.07;
    confetti({
        particleCount: count,
        spread: spread,
        startVelocity: 35 + lv * 2,
        scalar: scalar,
        origin: { y: 0.6 }
    });
    if (lv >= 8) {
        setTimeout(function() {
            confetti({ particleCount: Math.round(count / 2), angle: 60, spread: spread, origin: { x: 0, y: 0.7 }, scalar: scalar });
            confetti({ particleCount: Math.round(count / 2), angle: 120, spread: spread, origin: { x: 1, y: 0.7 }, scalar: scalar });
        }, 120);
    }
}

function playCorrectSound(level) {
    var src = CORRECT_SOUND_FILES[level];
    if (!src) return;
    try {
        var a = new Audio(src);
        a.play().catch(function() {});
    } catch (e) {}
}

function triggerCorrectFx(root) {
    var marker = (root || document).querySelector('.correct-fx-trigger');
    if (!marker) return;
    fireConfetti(CONFETTI_LEVEL);
    playCorrectSound(SOUND_LEVEL);
}

// Trims the XP pill / floating toast in freshly-rendered content to match
// GAMIFICATION_LEVEL. Runs synchronously right after each innerHTML swap, so
// removed elements never get a chance to flash.
function applyGamificationLevel(root) {
    root = root || document;
    var lv = GAMIFICATION_LEVEL;
    var pillWrap = root.querySelector('.fb-modal__xp-wrap');
    var pill = root.querySelector('.fb-modal__xp');
    var toast = root.querySelector('.xp-float');

    // Level 1: no XP visuals at all.
    if (lv <= 1) {
        if (pillWrap) pillWrap.remove();
        if (toast) toast.remove();
        return;
    }
    // Level 2: keep the pill but drop its pulse animation.
    if (lv === 2 && pill) {
        pill.classList.add('fb-modal__xp--no-anim');
    }
    // Floating toast only at level 4.
    if (lv < 4 && toast) {
        toast.remove();
    }
}

// Global helpers — referenced by inline onclick attributes inside the partial.
// Defined once in the wrapper so they survive innerHTML swaps.
function selectOption(el, answer) {
    document.querySelectorAll('.option-selectable').forEach(function(c) {
        c.classList.remove('option-selected');
    });
    el.classList.add('option-selected');
    var input = document.getElementById('selected-answer');
    var btn = document.getElementById('submit-btn');
    if (input) input.value = answer;
    if (btn) btn.disabled = false;
}

function closeFeedbackModal() {
    var modal = document.getElementById('feedback-modal');
    if (modal) modal.classList.add('fb-modal-overlay--closed');
}

function openFeedbackModal() {
    var modal = document.getElementById('feedback-modal');
    if (modal) modal.classList.remove('fb-modal-overlay--closed');
}

// SPA controller: intercepts form submit + data-spa link clicks, swaps the
// #question-slot innerHTML with server-rendered partial, and updates history.
(function() {
    var slot = document.getElementById('question-slot');
    if (!slot) return;

    function syncStreakChip() {
        // The navbar chip lives outside #question-slot and isn't replaced by the
        // innerHTML swap. The partial drops a <span class="streak-sync"> with
        // data-current/data-longest; copy those values to the chip after each swap.
        var sync = slot.querySelector('.streak-sync');
        var chip = document.querySelector('.answer-streak');
        if (!sync || !chip) return;
        var current = sync.dataset.current || '0';
        var longest = sync.dataset.longest || '0';
        var countEl = chip.querySelector('.answer-streak__count');
        if (!countEl) return;
        var changed = countEl.textContent !== current;
        countEl.textContent = current;
        chip.title = 'Racha de respuestas correctas seguidas. Mejor: ' + longest + '.';
        chip.classList.toggle('answer-streak--zero', current === '0');
        if (changed) {
            chip.classList.remove('answer-streak--pulse');
            // Force reflow so the animation restarts even if the class was
            // re-added inside the same frame.
            void chip.offsetWidth;
            chip.classList.add('answer-streak--pulse');
        }
    }

    function swap(url, init) {
        slot.classList.add('is-transitioning');
        var opts = Object.assign({ headers: {} }, init || {});
        opts.headers['X-Requested-With'] = 'XMLHttpRequest';
        return fetch(url, opts).then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        }).then(function(html) {
            slot.innerHTML = html;
            syncStreakChip();
            applyGamificationLevel(slot);
            triggerCorrectFx(slot);
        }).finally(function() {
            slot.classList.remove('is-transitioning');
        });
    }

    slot.addEventListener('submit', function(e) {
        var form = e.target.closest('#answer-form');
        if (!form) return;
        e.preventDefault();
        var btn = form.querySelector('#submit-btn');
        if (btn) btn.disabled = true; // prevent double-submit
        swap(form.action, {
            method: 'POST',
            body: new FormData(form),
        }).catch(function() {
            if (btn) btn.disabled = false;
        });
    });

    slot.addEventListener('click', function(e) {
        var link = e.target.closest('a[data-spa]');
        if (!link) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        var url = link.getAttribute('href');
        swap(url).then(function() {
            history.pushState({}, '', url);
        }).catch(function() {
            window.location.href = url;
        });
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeFeedbackModal();
    });

    // Initial load: the non-AJAX redirect path still injects feedback via session,
    // so fire the effect if the marker is present on first render.
    applyGamificationLevel(slot);
    triggerCorrectFx(slot);
})();
</script>
{% endblock %}
