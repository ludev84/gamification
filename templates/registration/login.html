{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Habilidades Blandas</title>
    <link rel="stylesheet" href="{% static 'soft_skills/css/styles.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                </div>
                <h1 class="login-title">Habilidades Blandas</h1>
                <p class="login-subtitle">Plataforma Gamificada &mdash; TecNM</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-error">
                Usuario o contraseña incorrectos. Intenta de nuevo.
            </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" required autofocus class="form-input" placeholder="Tu nombre de usuario">
                </div>
                <div class="form-group">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" required class="form-input" placeholder="Tu contraseña">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                Instituto Tecnológico de Mérida
            </div>
        </div>
    </div>
</body>
</html>
