{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion | Habilidades Blandas</title>
    <link rel="stylesheet" href="{% static 'soft_skills/css/styles.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Habilidades Blandas</h1>
            <p class="login-subtitle">Plataforma Gamificada - TecNM</p>

            {% if form.errors %}
            <div class="alert alert-error">
                Usuario o contrasena incorrectos. Intenta de nuevo.
            </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" required autofocus class="form-input">
                </div>
                <div class="form-group">
                    <label for="id_password">Contrasena</label>
                    <input type="password" name="password" id="id_password" required class="form-input">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Iniciar Sesion</button>
            </form>
        </div>
    </div>
</body>
</html>
